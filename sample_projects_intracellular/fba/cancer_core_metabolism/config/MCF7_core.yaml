models:
# MCF7 breast-cancer core metabolic model (Zielinski et al. 2017, trimmed)
  MCF7_core:
    settings:
      sbml_path: "MCF7_Zielinski_2017_core_trimmed.sbml"      # relative to --sbml-folder
      intracellular_dt: 0.01  # min

    exchanges:
      - substrate: "L-Arginine"
        fba_flux: "R_EX_arg_L_e"
        Km: 1.0      # mM
        Vmax: 0.02    # mmol/gDW cell/h (as in the project XML)
      - substrate: "L-Asparagine"
        fba_flux: "R_EX_asn_L_e"
        Km: 1.0      # mM
        Vmax: 0.02    # mmol/gDW cell/h (as in the project XML)
      - substrate: "L-Aspartate"
        fba_flux: "R_EX_asp_L_e"
        Km: 1.0      # mM
        Vmax: 0.02    # mmol/gDW cell/h (as in the project XML)
      - substrate: "Choline"
        fba_flux: "R_EX_chol_e"
        Km: 1.0      # mM
        Vmax: 0.02    # mmol/gDW cell/h (as in the project XML)
