# dFBA Configuration File
# dFBA definition of the bacterial_colony sample project (E. coli core model, Ecoli_core.xml).
# Input for addons/dFBA/utils/dfba_configurator.py, which writes the substrates, the cell definition and the
# dFBA block of the PhysiCell XML. The rest of PhysiCell_settings.xml (domain, motility, ...) is set by hand.
#
# Structure:
#   substrates: List of substrate configurations for the microenvironment
#     Each substrate contains:
#       - name: Substrate name (must match substrate names in exchanges)
#       - diffusion_coefficient: Diffusion coefficient (micron^2/min)
#       - decay_rate: Decay rate (1/min)
#       - initial_condition: Initial concentration (mM)
#
#   models: Dictionary of model configurations, keyed by cell definition name
#     Each model contains:
#       - settings: sbml_path (relative to --sbml-folder or absolute) and intracellular_dt
#       - exchanges: List of exchange reaction configurations
#       - growth_model: Growth model parameters
#       - death_model: Death model configuration
#

substrates:
  - name: "oxygen"
    diffusion_coefficient: 120000.0  # micron^2/min
    decay_rate: 0.0  # 1/min
    initial_condition: 5  # mM

  - name: "glucose"
    diffusion_coefficient: 35000.0  # micron^2/min
    decay_rate: 0.0  # 1/min
    initial_condition: 4  # mM

  - name: "acetate"
    diffusion_coefficient: 50000.00  # micron^2/min
    decay_rate: 0.0  # 1/min
    initial_condition: 0.0  # mM

  - name: "lactate"
    diffusion_coefficient: 50000.00  # micron^2/min
    decay_rate: 0.0  # 1/min
    initial_condition: 0.0  # mM

  - name: "CO2"
    diffusion_coefficient: 100000.0  # micron^2/min
    decay_rate: 0.0  # 1/min
    initial_condition: 0.0  # mM

models:
  ecoli:
    settings:
      sbml_path: "Ecoli_core.xml"      # relative to --sbml-folder
      intracellular_dt: 0.001  # min

    exchanges:
      - substrate: "glucose"
        fba_flux: "R_EX_glc__D_e"
        Km: 0.01      # mM
        Vmax: 10.0    # mmol/gDW cell/h (as in the project XML)
      - substrate: "acetate"
        fba_flux: "R_EX_ac_e"
        Km: 0.01      # mM
        Vmax: 10.0    # mmol/gDW cell/h (as in the project XML)
      - substrate: "lactate"
        fba_flux: "R_EX_lac__D_e"
        Km: 0.01      # mM
        Vmax: 10.0    # mmol/gDW cell/h (as in the project XML)
      - substrate: "oxygen"
        fba_flux: "R_EX_o2_e"
        Km: 0.0005      # mM
        Vmax: 20.0    # mmol/gDW cell/h (as in the project XML)
      - substrate: "CO2"
        fba_flux: "R_EX_co2_e"
        Km: 0.01      # mM
        Vmax: 10.0    # mmol/gDW cell/h (as in the project XML)

    growth_model:
      cell_density: 1.04  # g/ml
      reference_volume: 1.3  # pg
      nuclear_volume: 0.0  # micron^3; 0 as in the project XML (physicell-settings rejects 0, see addons/dFBA/utils/README.md)
      max_growth_rate: 0.95  # 1/min (units label as in the project XML)
      objective_reaction: "R_Biomass_Ecoli_core"

    death_model:
      enabled: true
      death_type: "necrosis"
      death_trigger_flux: R_ATPM
      death_flux_threshold: 8.39
      death_rate_increase: 1.67e-5
